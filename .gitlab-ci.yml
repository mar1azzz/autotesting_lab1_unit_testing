image: node:20

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

stages:
  - lint
  - test

lint:
  stage: lint
  script:
    - npm ci
    - npm run eslint

test:
  stage: test
  script:
    - npm run coverage
  artifacts:
    paths:
      - coverage/
      - reports/
    expire_in: 7 days
